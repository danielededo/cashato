# Minimal single-pod Gitea for the LOCAL GitOps bridge.
# No HA subcharts: sqlite DB, in-memory session/cache, on-disk level queue.
# This is a throwaway git remote for Argo CD until the repo goes public on
# GitHub — at which point only the Argo Application repoURL changes.
replicaCount: 1

# Recreate (not the chart's default RollingUpdate): Gitea's level queue holds an
# EXCLUSIVE lock on the RWO PVC (/data/queues/common). A rolling update briefly
# runs two pods → the new one can't lock the level db and crashloops
# ("unable to lock level db ... resource temporarily unavailable"). Recreate tears
# the old pod down first, releasing the lock. Same pattern as Mimir/Loki/Tempo/MinIO.
strategy:
  type: Recreate

# Disable every bundled HA dependency (all default to enabled in this chart).
postgresql-ha:
  enabled: false
postgresql:
  enabled: false
valkey-cluster:
  enabled: false
valkey:
  enabled: false

persistence:
  enabled: true

gitea:
  config:
    database:
      DB_TYPE: sqlite3
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
    service:
      # Single-user bridge: no open sign-ups.
      DISABLE_REGISTRATION: true
    webhook:
      # Allow webhook delivery to private/internal hosts. Gitea DENIES private
      # targets by default (SSRF guard), which blocks the build-on-push
      # webhook whose sink is the in-cluster EventListener Service
      # (el-cashato-ci.cashato-ci.svc → a 10.96/12 ClusterIP). `private` re-allows
      # RFC1918 ranges (covers the service CIDR) without opening external hosts.
      ALLOWED_HOST_LIST: private
      # Max commits embedded in a push payload (default 15). The CI CEL path
      # filter inspects body.commits[*], so a batched push could silently hide
      # the one commit that touched src/ beyond the cut. 50 must match the
      # filter's fail-closed guard (body.total_commits > 50 → build anyway) in
      # k8s/manifests/tekton-ci/base/eventlistener.yaml.
      PAYLOAD_COMMIT_LIMIT: 50
    "cron.cleanup_packages":
      # CI pushes three images per commit into the built-in OCI registry and
      # nothing ever removed them: after ~50 builds /data/packages was 4 GB, the
      # largest volume on the cluster by far. Deleting the old TAGS is the manual
      # part; this is what actually reclaims the disk, by collecting the blobs
      # those tags referenced.
      #
      # OLDER_THAN defaults to 24h, i.e. space freed today is not returned until
      # tomorrow. On a single-user cluster where the only writer is our own CI
      # there is no concurrent push to protect, so 1h is plenty of grace — and
      # hourly beats the daily default when a heavy day pushes 15 builds.
      ENABLED: true
      SCHEDULE: "@every 1h"
      OLDER_THAN: 1h

# Dedicated NodePort Service exposing Gitea's HTTP port (3000) — which also serves
# the built-in OCI registry (/v2/) — to the kind NODES so containerd can pull
# images from it (node-pull wiring). We do NOT flip gitea-http to NodePort:
# that Service is HEADLESS (clusterIP: None) and headless + NodePort is invalid.
# A separate Service is additive and leaves the git bridge (Argo's in-cluster
# ClusterIP path) untouched.
#
# The mirror endpoint baked into containerd (infra/01-cluster.tf,
# containerd_config_patches) points at 127.0.0.1:<nodePort>, so nodePort is PINNED
# to 30300 — the two must stay in sync.
extraDeploy:
  - apiVersion: v1
    kind: Service
    metadata:
      name: gitea-registry
      labels:
        app.kubernetes.io/name: gitea
        cashato/purpose: oci-registry-nodeport
    spec:
      type: NodePort
      selector:
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/name: gitea
      ports:
        - name: http
          port: 3000
          targetPort: 3000
          nodePort: 30300
