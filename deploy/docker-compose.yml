# Fast local dev (phases A-B). In phase C the DB moves to CNPG on kind.
services:
  postgres:
    image: postgres:17-alpine
    container_name: cashato-postgres
    environment:
      POSTGRES_USER: cashato
      POSTGRES_PASSWORD: cashato
      POSTGRES_DB: cashato
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      # wal_level=logical: ready for phase D (Debezium/CDC)
      - "postgres"
      - "-c"
      - "wal_level=logical"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashato -d cashato"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    container_name: cashato-nats
    command: ["-js"] # enable JetStream
    ports:
      - "4222:4222"

  ingest-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.svc
    container_name: cashato-ingest-api
    working_dir: /app/services/ingest-api
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://cashato:cashato@postgres:5432/cashato
      NATS_URL: nats://nats:4222
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on: [postgres, nats]

  etl-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.svc
    container_name: cashato-etl-worker
    command: ["python", "services/etl-worker/worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://cashato:cashato@postgres:5432/cashato
      NATS_URL: nats://nats:4222
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on: [postgres, nats]

  query-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.svc
    container_name: cashato-query-api
    working_dir: /app/services/query-api
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql+psycopg://cashato:cashato@postgres:5432/cashato
    ports:
      - "8001:8001"
    depends_on: [postgres]

volumes:
  pgdata:
  uploads:
