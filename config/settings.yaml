# Tunable settings (data, not logic). Mounted as the cashato-config ConfigMap
# (kustomize name-hash: editing this rolls the pods, no image rebuild).
# Infra endpoints (DATABASE_URL, NATS_URL) stay as env vars / Secrets.

categorization:
  # minimum model confidence to accept an ML prediction (else rules/default).
  # Calibrated on 5 held-out splits (2026-07): every confidence band below
  # 0.75 was majority-WRONG (20-45% precision) while 0.75-0.80 was already
  # majority-right (59%); cumulative >= 0.75 is ~79% precise on ~77% of
  # unseen texts. Below the bar an honest `other` feeds the Review queue and
  # the next labeling round instead of silently polluting the aggregates.
  model_threshold: 0.75
  # embedding model used by the classifier (sentence-transformers)
  embed_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  knn_k: 5

transfers:
  # date window (days) to match an internal transfer between own accounts
  window_days: 4

uploads:
  # per-file size cap (bytes); enforced server-side by ingest-api (413 if over)
  max_file_bytes: 10485760 # 10 MB
  # max files per multi-upload batch (exposed via /meta, enforced by the
  # Upload page before anything is sent)
  max_files_per_batch: 50
  # accepted file extensions (bank statements are PDF / CSV / XLSX).
  # No ".xls": no parser reads the legacy binary format; inviting it would
  # only produce uploads that fail in the worker.
  allowed_extensions: [".pdf", ".csv", ".xlsx"]
