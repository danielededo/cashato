# Merchant Category Code (ISO 18245) -> canonical category code.
# Standard and language-agnostic; present in the Trade Republic CSV
# (mcc_code field), often absent elsewhere. Highest-precision resolver in
# the chain (priority 1, before the embedding model).
#
# Coverage: the Banca d'Italia list of reportable MCCs (Circolare 154,
# "Merchant Category Code - lista segnalabili agg.2", 335 codes) plus the
# brand-specific ISO ranges the list omits, each code with its official
# English description. Key = 4-digit MCC as a string, or a "lo-hi" range
# (see Categorizer.mcc_category: exact entries win over ranges).

# --- travel: brand-specific ISO blocks (one code PER airline/car-rental/
# hotel chain, e.g. 3246 seen in real card data). Not in the BdI list, but
# issuers use them; enumerating ~1000 brands is what the range form is for.
"3000-3299": travel   # airlines (brand-specific)
"3300-3499": travel   # car rental agencies (brand-specific)
"3500-3999": travel   # lodging (brand-specific)

