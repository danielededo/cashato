# API proxy drop-in — mounted ONLY by compose.yaml. It is deliberately NOT
# copied into the image: in Kubernetes the Envoy Gateway splits `/api/v1` off
# before nginx ever sees it, so nginx.conf's `include /etc/nginx/api-proxy/*.conf`
# matches nothing and none of this exists. Under compose there is no gateway, so
# nginx has to perform the same split itself.
#
# The split MIRRORS k8s/manifests/services/base/httproutes.yaml: ingest-api
# enumerates its (few, write-side) paths and query-api takes all of `/api/v1` as
# a catch-all. nginx selects the LONGEST matching prefix irrespective of block
# order, which is the same rule Gateway API uses to break the tie — so both
# environments route identically. Keep the two path lists in step.

# nginx's body limit must sit ABOVE the application's so the application's wins.
# /uploads takes one file per request and enforces the settings.yaml cap itself
# (10 MB) with a structured JSON 413; nginx's default is 1 MB, which would
# shadow that and hand the user an HTML error page for a file the API would have
# accepted. Generous headroom, because the meaningful limit is the app's.
client_max_body_size 32m;
# Stream the body through rather than spooling it to disk first.
proxy_request_buffering off;
# /admin/reprocess re-enqueues every stored file, which is a DB scan plus one
# publish per file — comfortably longer than the 60s default.
proxy_read_timeout 300s;

# Set once at server level and inherited by the locations below. The client's
# own `Origin` is forwarded untouched, which the ingest-api CSRF guard requires:
# it accepts a loopback origin and 403s anything else.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# --- ingest-api: the write side (enumerated, exactly as the HTTPRoute does) ---
location /api/v1/uploads  { proxy_pass http://ingest-api:8000; }
location /api/v1/files    { proxy_pass http://ingest-api:8000; }
location /api/v1/feedback { proxy_pass http://ingest-api:8000; }
location /api/v1/profile  { proxy_pass http://ingest-api:8000; }
location /api/v1/admin    { proxy_pass http://ingest-api:8000; }

# --- query-api: everything else under /api/v1 (catch-all) --------------------
# A catch-all rather than an enumeration on purpose: with a list, every new read
# endpoint needs a config change, and forgetting one does not 404 — it falls
# through to the SPA, which answers 200 with HTML. The same reasoning is spelled
# out at length in httproutes.yaml.
location /api/v1 { proxy_pass http://query-api:8001; }
