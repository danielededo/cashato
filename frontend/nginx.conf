# Serve the built SPA. In Kubernetes the gateway path-splits (`/api/v1` → the
# APIs, `/` → here), so nginx only serves static files + the SPA fallback
# (client-side routing) and does NOT proxy the API. Unprivileged nginx listens
# on 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Escape hatch for running the stack WITHOUT a gateway (compose.yaml mounts
    # frontend/api-proxy.conf here, which proxies /api/v1 to the two APIs).
    # A wildcard include that matches no files is a no-op, so in the cluster —
    # where nothing is mounted — this line changes precisely nothing.
    include /etc/nginx/api-proxy/*.conf;

    # The shell must never be cached. Its <script> tag names a CONTENT-HASHED
    # bundle, so a browser holding a stale index.html after a deploy asks for an
    # asset filename that no longer exists in the new image: 404, blank page,
    # fixable only by a hard refresh. Without an explicit header browsers apply
    # heuristic freshness and will cache it.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # hashed asset bundles — cache hard. Safe precisely because the name changes
    # with the content, so a new deploy can never be served a stale one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path returns index.html (React Router takes over)
    location / {
        add_header X-Content-Type-Options "nosniff";
        try_files $uri $uri/ /index.html;
    }
}
