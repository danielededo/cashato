# Serve the built SPA. The gateway path-splits: `/api/v1` → the APIs, `/` → here.
# So nginx only serves static files + the SPA fallback (client-side routing); it
# does NOT proxy the API. Unprivileged nginx listens on 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # hashed asset bundles — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path returns index.html (React Router takes over)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
