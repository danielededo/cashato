# Declarative creation of the MLflow backend-store database (C6), owned by the
# mlflow role. CNPG's Database CRD manages it — no manual createdb. MLflow creates
# its own tables inside this database, so no cross-schema grants are needed.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mlflow
  namespace: cashato-data
spec:
  cluster:
    name: cashato-db
  name: mlflow
  owner: mlflow
