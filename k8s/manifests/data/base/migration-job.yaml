# Alembic migrations run as a one-shot Job (not at service startup): it runs as
# the schema owner (cashato_migrator, from the CNPG-generated `cashato-db-app`
# secret), avoids concurrent-runner races across service replicas, and gives a
# clean pass/fail before services start. sync-wave 1 = after the Cluster; the
# initContainer additionally waits until Postgres actually accepts connections.
# A Job's pod template is immutable, so a plain `apply` can never update this
# Job once created: the one from the first deploy would sit there forever while
# Argo reports OutOfSync, and every migration added later would silently never
# run. `Replace=true` is the fix — Argo deletes and recreates the Job instead of
# applying it.
#
# NOT a Sync hook, deliberately. Argo excludes hooks from diffing, and the
# migrate image tag appears nowhere else in this app, so as a hook a new image
# produced NO detectable drift: the app stayed "Synced" and the migration never
# ran. As a tracked resource the tag change IS the drift that triggers the sync.
# It also means this only re-runs when the manifest really changed, rather than
# on every unrelated sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-db
          image: cashato/migrate:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - python
            - -c
            - |
              import os, sys, time, psycopg
              for _ in range(120):
                  try:
                      psycopg.connect().close()
                      print("db ready"); sys.exit(0)
                  except Exception as e:
                      print("waiting for db:", e); time.sleep(3)
              sys.exit(1)
          env:
            - { name: PGHOST, value: cashato-db-rw.cashato-data.svc }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: cashato }
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: cashato-db-app, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: cashato-db-app, key: password }
      containers:
        - name: alembic
          image: cashato/migrate:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          workingDir: /app
          command: ["alembic", "upgrade", "head"]
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: cashato-db-app, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: cashato-db-app, key: password }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@cashato-db-rw.cashato-data.svc:5432/cashato
