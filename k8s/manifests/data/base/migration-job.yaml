# Alembic migrations run as a one-shot Job (not at service startup): it runs as
# the schema owner (cashato_migrator, from the CNPG-generated `cashato-db-app`
# secret), avoids concurrent-runner races across service replicas, and gives a
# clean pass/fail before services start. sync-wave 1 = after the Cluster; the
# initContainer additionally waits until Postgres actually accepts connections.
# Run as an Argo **Sync hook**, for the same reason as db-grants: a Job's pod
# template is immutable, so as a plain tracked resource the Job created at the
# first deploy would sit there forever — Argo reports OutOfSync but cannot
# replace it, and every migration added afterwards silently never runs. As a
# hook it is deleted+recreated on each sync (BeforeHookCreation).
# `alembic upgrade head` is a no-op when already at head, so re-running is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-db
          image: cashato/migrate:dev
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os, sys, time, psycopg
              for _ in range(120):
                  try:
                      psycopg.connect().close()
                      print("db ready"); sys.exit(0)
                  except Exception as e:
                      print("waiting for db:", e); time.sleep(3)
              sys.exit(1)
          env:
            - { name: PGHOST, value: cashato-db-rw.cashato-data.svc }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: cashato }
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: cashato-db-app, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: cashato-db-app, key: password }
      containers:
        - name: alembic
          image: cashato/migrate:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["alembic", "upgrade", "head"]
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: cashato-db-app, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: cashato-db-app, key: password }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@cashato-db-rw.cashato-data.svc:5432/cashato
