apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources land in cashato-data (the Namespace object itself is unaffected).
namespace: cashato-data

resources:
  - namespace.yaml
  - sealedsecret-etl-writer.yaml
  - sealedsecret-query-reader.yaml
  - sealedsecret-mlflow-db.yaml
  - sealedsecret-ml-reader.yaml
  - sealedsecret-minio.yaml
  - backup-bucket-job.yaml
  - cluster.yaml
  - scheduled-backup.yaml
  - migration-job.yaml
  - grant-job.yaml
  - mlflow-database.yaml
