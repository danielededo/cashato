# CloudNativePG Postgres cluster for cashato. Single instance (personal scale,
# local kind). wal_level=logical is set now so adding CDC (Debezium) later needs no
# cluster recreation. The DB `cashato` is owned by cashato_migrator, which the
# Alembic migration Job connects as to run all DDL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cashato-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1

  storage:
    size: 1Gi

  postgresql:
    parameters:
      wal_level: logical

  # Continuous backup: WAL archiving + base backups (ScheduledBackup) to the
  # in-cluster MinIO ("cnpg-backups" bucket, created by the backup-bucket Job).
  # This window is what makes the hand-made data recoverable — uploaded files
  # can always be reprocessed, but manual category corrections,
  # gold.training_labels and category_feedback exist only in this database.
  # In-tree barmanObjectStore is deprecated upstream in favour of the Barman
  # Cloud plugin; the 1.30 CRD still serves it, migrate when the operator drops it.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/
      endpointURL: http://minio.minio.svc:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: username
        secretAccessKey:
          name: minio-creds
          key: password
      wal:
        compression: gzip
      data:
        compression: gzip

  bootstrap:
    initdb:
      database: cashato
      owner: cashato_migrator

  # Least-privilege app roles. CNPG creates/reconciles the LOGIN roles and
  # sets their password from the referenced Secret (decrypted by Sealed Secrets).
  # Schema GRANTs are applied separately by the db-grants Job (CNPG manages the
  # role object + password, not per-schema privileges). Services connect as these
  # roles, never as the owner cashato_migrator.
  managed:
    roles:
      - name: etl_writer # ingest-api + etl-worker: RW bronze/silver (+ feedback)
        ensure: present
        login: true
        passwordSecret:
          name: etl-writer-db
      - name: query_reader # query-api: read-only gold
        ensure: present
        login: true
        passwordSecret:
          name: query-reader-db
      - name: mlflow # owns the mlflow database (MLflow backend store)
        ensure: present
        login: true
        passwordSecret:
          name: mlflow-db
      - name: ml_reader # training/retrain Jobs: read-only silver + gold (dataset)
        ensure: present
        login: true
        passwordSecret:
          name: ml-reader-db
