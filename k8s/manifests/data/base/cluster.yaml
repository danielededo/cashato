# CloudNativePG Postgres cluster for cashato. Single instance (personal scale,
# local kind). wal_level=logical is set now so phase D (Debezium/CDC) needs no
# cluster recreation. The DB `cashato` is owned by cashato_migrator, which the
# Alembic migration Job connects as to run all DDL.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cashato-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1

  storage:
    size: 1Gi

  postgresql:
    parameters:
      wal_level: logical

  bootstrap:
    initdb:
      database: cashato
      owner: cashato_migrator

  # Least-privilege app roles (C5). CNPG creates/reconciles the LOGIN roles and
  # sets their password from the referenced Secret (decrypted by Sealed Secrets).
  # Schema GRANTs are applied separately by the db-grants Job (CNPG manages the
  # role object + password, not per-schema privileges). Services connect as these
  # roles, never as the owner cashato_migrator.
  managed:
    roles:
      - name: etl_writer # ingest-api + etl-worker: RW bronze/silver (+ feedback)
        ensure: present
        login: true
        passwordSecret:
          name: etl-writer-db
      - name: query_reader # query-api: read-only gold
        ensure: present
        login: true
        passwordSecret:
          name: query-reader-db
      - name: mlflow # owns the mlflow database (MLflow backend store, C6)
        ensure: present
        login: true
        passwordSecret:
          name: mlflow-db
      - name: ml_reader # training/retrain Jobs: read-only silver + gold (dataset)
        ensure: present
        login: true
        passwordSecret:
          name: ml-reader-db
