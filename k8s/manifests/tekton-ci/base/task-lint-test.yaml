apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cashato-lint-test
spec:
  description: >-
    Lint (ruff), type-check (mypy) and unit-test (pytest) the cashato repo,
    mirroring the project's own make targets (Makefile: lint/typecheck/test).
    Installs the service runtime deps + dev tools; the unit tests exercise the
    rule/mcc categorization chain and transfer pairing (no model / no torch path).
  workspaces:
    - name: source
  steps:
    - name: lint-type-test
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: PIP_DISABLE_PIP_VERSION_CHECK
          value: "1"
        # Config lives at the repo root in the cloned workspace (not baked); the
        # unit tests load categories/mcc/settings from here.
        - name: CASHATO_CONFIG_DIR
          value: config
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "== install (package + svc runtime + dev tools) =="
        pip install --no-cache-dir -q '.[svc,dev]'
        # Mirror the project's own make targets (Makefile: lint/typecheck/test).
        echo "== ruff (make lint) =="
        ruff check .
        echo "== mypy (make typecheck) =="
        mypy src
        echo "== pytest (make test) =="
        python -m pytest
