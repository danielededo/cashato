# REFERENCE ONLY — not part of kustomization.yaml, so Argo does NOT create it.
# A PipelineRun is a runtime trigger (one per CI run); until C7c-d wires Gitea
# webhooks via Tekton Triggers, start a run by hand:
#
#   kubectl -n cashato-ci create -f k8s/manifests/tekton-ci/base/pipelinerun-example.yaml
#
# (`create`, not `apply` — generateName mints a fresh name each run.) Watch with
# `kubectl -n cashato-ci get pipelinerun -w` or the Tekton Dashboard. The pruner
# (TektonConfig) keeps the last 20 runs.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cashato-ci-
  namespace: cashato-ci
spec:
  taskRunTemplate:
    serviceAccountName: cashato-ci
  pipelineRef:
    name: cashato-ci
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: basic-auth
      secret:
        secretName: gitea-basic-auth
    - name: dockerconfig
      secret:
        secretName: gitea-dockerconfig
