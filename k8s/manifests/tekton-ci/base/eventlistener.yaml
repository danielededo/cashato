# The webhook sink. Creating this spins up a Deployment + Service named
# `el-cashato-ci` (port 8080). Both sender (Gitea) and receiver live IN the cluster,
# so Gitea POSTs to el-cashato-ci.cashato-ci.svc:8080 over cluster DNS — no ingress,
# no Gateway, no public exposure (a real advantage of the in-cluster Gitea bridge).
#
# Two interceptors gate every delivery:
#   1. github  — verifies the HMAC-SHA256 signature (X-Hub-Signature-256) against
#                the shared secret AND filters to push events. Gitea sends
#                GitHub-compatible headers (X-Hub-Signature-256 / X-GitHub-Event),
#                so the stock `github` ClusterInterceptor works against Gitea.
#   2. cel     — accepts only pushes to main (drops branch/tag pushes).
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: cashato-ci
spec:
  serviceAccountName: cashato-ci-triggers
  triggers:
    - name: gitea-push-main
      interceptors:
        - name: verify-signature-and-push
          ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: gitea-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        # Only push to main, AND only when a path shipped in an image changed — so
        # a docs/k8s/infra/config-only push does NOT rebuild (config is a runtime
        # ConfigMap; what matters is src/**, frontend/**, docker/**, pyproject.toml,
        # alembic.ini). body.commits is TRUNCATED by Gitea at PAYLOAD_COMMIT_LIMIT
        # (raised to 50 in infra/modules/gitea/values.yaml — keep in sync): a
        # truncated payload could hide the one commit that touched src/, so pushes
        # bigger than the limit build unconditionally (fail closed: a spurious
        # build beats a silent code/manifest skew).
        - name: only-main-and-source-changes
          ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                (body.total_commits > 50 ||
                body.commits.exists(c, (c.added + c.modified + c.removed).exists(f,
                f.startsWith('src/') || f.startsWith('frontend/') || f.startsWith('docker/') ||
                f == 'pyproject.toml' || f == 'alembic.ini')))
      bindings:
        - ref: cashato-ci-push
      template:
        ref: cashato-ci
