# The webhook sink (C7c-d). Creating this spins up a Deployment + Service named
# `el-cashato-ci` (port 8080). Both sender (Gitea) and receiver live IN the cluster,
# so Gitea POSTs to el-cashato-ci.cashato-ci.svc:8080 over cluster DNS — no ingress,
# no Gateway, no public exposure (a real advantage of the in-cluster Gitea bridge).
#
# Two interceptors gate every delivery:
#   1. github  — verifies the HMAC-SHA256 signature (X-Hub-Signature-256) against
#                the shared secret AND filters to push events. Gitea sends
#                GitHub-compatible headers (X-Hub-Signature-256 / X-GitHub-Event),
#                so the stock `github` ClusterInterceptor works against Gitea.
#   2. cel     — accepts only pushes to main (drops branch/tag pushes).
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: cashato-ci
spec:
  serviceAccountName: cashato-ci-triggers
  triggers:
    - name: gitea-push-main
      interceptors:
        - name: verify-signature-and-push
          ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: gitea-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        # Only push to main, AND only when a source-relevant path changed — so a
        # docs/k8s/infra/config-only push does NOT rebuild the images (config is a
        # runtime ConfigMap now; only src/**, build/**, or pyproject.toml matter).
        - name: only-main-and-source-changes
          ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                body.commits.exists(c, (c.added + c.modified + c.removed).exists(f,
                  f.startsWith('src/') || f.startsWith('frontend/') || f.startsWith('build/') || f == 'pyproject.toml'))
      bindings:
        - ref: cashato-ci-push
      template:
        ref: cashato-ci
