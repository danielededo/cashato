# CI pipeline (C7c-c) — DAG:
#
#   fetch-source ─▶ lint-test ─┬─▶ build-push-svc      (image: cashato/svc)
#                              └─▶ build-push-migrate  (image: cashato/migrate)
#
#   clone (git-clone) -> ruff/mypy/pytest (cashato-lint-test) -> buildah build+push
#   of the two light images to Gitea's OCI registry, tagged by commit SHA. The two
#   builds run in parallel once tests pass (both runAfter: [lint-test]).
#
# ── which services each built image feeds (build -> consumers) ───────────────────
#   build-push-svc     -> cashato/svc     -> ns cashato:      ingest-api, etl-worker,
#                                                             query-api, categorizer
#   build-push-migrate -> cashato/migrate -> ns cashato-data: migration-job, grant-job
#   (see k8s/manifests/tekton-ci/README.md for the full dependency map.)
#
# The git-clone and buildah Tasks are resolved at runtime from the Tekton catalog
# via the HUB RESOLVER (enable-hub-resolver=true, profile=all). The lint/test Task
# is project-specific (cashato-lint-test, same namespace).
#
# Push target = gitea-http.gitea.svc:3000/cashato/<img>:<sha> — the same ref the
# nodes' containerd mirror resolves for pulls (C7c-b). Plain HTTP -> TLSVERIFY=false.
# STORAGE_DRIVER=vfs for buildah-in-pod on kind.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cashato-ci
spec:
  params:
    - name: repo-url
      type: string
      default: http://gitea-http.gitea.svc:3000/cashato/cashato.git
    - name: revision
      type: string
      default: main
    - name: registry
      type: string
      default: gitea-http.gitea.svc:3000
    - name: deploy-repo-url
      type: string
      default: http://gitea-http.gitea.svc:3000/cashato/cashato-deploy.git
  workspaces:
    - name: shared        # cloned source, shared across tasks
    - name: basic-auth    # git-clone HTTP creds (.gitconfig + .git-credentials)
    - name: dockerconfig  # buildah push creds (config.json)
  results:
    - name: svc-image
      value: $(tasks.build-push-svc.results.IMAGE_URL)
    - name: migrate-image
      value: $(tasks.build-push-migrate.results.IMAGE_URL)
    - name: commit
      value: $(tasks.fetch-source.results.commit)
  tasks:
    - name: fetch-source
      taskRef:
        resolver: hub
        params:
          - { name: catalog, value: tekton-catalog-tasks }
          - { name: type, value: artifact }
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: version, value: "0.9" }
      params:
        - { name: url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
        - { name: depth, value: "1" }
      workspaces:
        - { name: output, workspace: shared }
        - { name: basic-auth, workspace: basic-auth }

    - name: lint-test
      runAfter: [fetch-source]
      taskRef:
        name: cashato-lint-test
      workspaces:
        - { name: source, workspace: shared }

    # cashato/svc — the shared service image. CONSUMED BY 4 Deployments (ns cashato):
    # ingest-api, etl-worker, query-api, categorizer. (build/Dockerfile.svc)
    - name: build-push-svc
      runAfter: [lint-test]
      taskRef:
        resolver: hub
        params:
          - { name: catalog, value: tekton-catalog-tasks }
          - { name: type, value: artifact }
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: version, value: "0.9" }
      params:
        - { name: IMAGE, value: "$(params.registry)/cashato/svc:$(tasks.fetch-source.results.commit)" }
        - { name: DOCKERFILE, value: ./build/Dockerfile.svc }
        - { name: CONTEXT, value: . }
        - { name: TLSVERIFY, value: "false" }
        - { name: STORAGE_DRIVER, value: vfs }
      workspaces:
        - { name: source, workspace: shared }
        - { name: dockerconfig, workspace: dockerconfig }

    # cashato/migrate — the Alembic migrator image. CONSUMED BY 2 Jobs (ns cashato-data):
    # migration-job (alembic upgrade head) + grant-job (DB privilege GRANTs).
    # (build/Dockerfile.migrate)
    - name: build-push-migrate
      runAfter: [lint-test]
      taskRef:
        resolver: hub
        params:
          - { name: catalog, value: tekton-catalog-tasks }
          - { name: type, value: artifact }
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: version, value: "0.9" }
      params:
        - { name: IMAGE, value: "$(params.registry)/cashato/migrate:$(tasks.fetch-source.results.commit)" }
        - { name: DOCKERFILE, value: ./build/Dockerfile.migrate }
        - { name: CONTEXT, value: . }
        - { name: TLSVERIFY, value: "false" }
        - { name: STORAGE_DRIVER, value: vfs }
      workspaces:
        - { name: source, workspace: shared }
        - { name: dockerconfig, workspace: dockerconfig }

    # After BOTH images are pushed, pin the services/data Argo apps in the
    # cashato-deploy config repo to this commit's registry image refs (kustomize
    # .images) + push. Argo then redeploys onto :<sha>. Only writer of cashato-deploy.
    - name: bump-deploy
      runAfter: [build-push-svc, build-push-migrate]
      taskRef:
        name: cashato-bump-deploy
      params:
        - { name: deploy-repo-url, value: $(params.deploy-repo-url) }
        - { name: registry, value: $(params.registry) }
        - { name: revision, value: $(tasks.fetch-source.results.commit) }
      workspaces:
        - { name: source, workspace: shared }
        - { name: basic-auth, workspace: basic-auth }
