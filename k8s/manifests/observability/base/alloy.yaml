# Grafana Alloy — the unified collector (successor of Grafana Agent + Promtail +
# OTel Collector). It does all three LGTM signals: METRICS (scrape pods annotated
# prometheus.io/scrape=true → remote_write to Mimir), LOGS (tail every pod's logs
# via the Kubernetes API → push to Loki), and TRACES (receive OTLP from the
# services → batch → forward to Tempo). Logs are tailed through the API server
# (loki.source.kubernetes), not host files, so a single Deployment suffices (no
# DaemonSet / hostPath). Telemetry reporting is off (--disable-reporting).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  # loki.source.kubernetes streams container logs via the API server.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: |
    // Discover every pod in the cluster; the relabel stage below keeps only the
    // ones that opt in via the prometheus.io/scrape annotation.
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "annotated" {
      targets = discovery.kubernetes.pods.targets

      // Opt-in: keep pods annotated prometheus.io/scrape: "true".
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }

      // Only scrape running pods with an assigned IP (skip Pending/Completed).
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Running"
        action        = "keep"
      }

      // Metrics path from prometheus.io/path (default /metrics).
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        action        = "replace"
      }

      // Rewrite the target to podIP:<prometheus.io/port>.
      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        regex         = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
        action        = "replace"
      }

      // Friendly labels for querying in Grafana.
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    prometheus.scrape "annotated" {
      targets         = discovery.relabel.annotated.output
      forward_to      = [prometheus.remote_write.mimir.receiver]
      scrape_interval = "30s"
    }

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir.observability.svc:8080/api/v1/push"
      }
    }

    // ---- LOGS ----------------------------------------------------------------
    // Reuse the same pod discovery, but relabel for log labels (keep cardinality
    // low: namespace/pod/container/app only). loki.source.kubernetes tails each
    // pod's logs through the API server, so no host mounts / DaemonSet needed.
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.default.receiver]
    }

    // Our services emit structured JSON logs (libs.obs); lift "level" to a label
    // so log lines are filterable by severity in Grafana. Non-JSON lines (Mimir,
    // Grafana, operators) pass through unchanged — the stage extracts nothing.
    loki.process "default" {
      forward_to = [loki.write.loki.receiver]

      stage.json {
        expressions = { level = "level" }
      }
      stage.labels {
        values = { level = "" }
      }
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki.observability.svc:3100/loki/api/v1/push"
      }
    }

    // ---- TRACES --------------------------------------------------------------
    // Single OTLP front door for the services (they export to alloy:4317). Batch
    // spans, then forward to Tempo over OTLP/gRPC.
    otelcol.receiver.otlp "default" {
      grpc { endpoint = "0.0.0.0:4317" }
      http { endpoint = "0.0.0.0:4318" }
      output {
        traces = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.observability.svc:4317"
        tls { insecure = true }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.17.1
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --disable-reporting
          ports:
            - { name: http, containerPort: 12345 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: alloy-config }
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - { name: http, port: 12345, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
