# Grafana Mimir — the "M" of the LGTM stack: long-term, horizontally-scalable
# metrics storage (Prometheus-compatible; the remote_write target for Alloy and
# the Prometheus datasource for Grafana). Run in MONOLITHIC mode (-target=all,
# one process) — the size-appropriate topology for kind at personal scale, vs the
# ~15-20-pod microservices chart. Blocks live on MinIO (S3), the same object
# store MLflow already uses; ruler/alertmanager (unused here) stay on local disk.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    # Single-tenant local install; no telemetry leaves the machine.
    multitenancy_enabled: false
    usage_stats:
      enabled: false

    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: info

    # S3 (MinIO) is the shared object-storage backend; creds injected via env and
    # expanded with -config.expand-env=true so no secret is written to this file.
    common:
      storage:
        backend: s3
        s3:
          endpoint: minio.minio.svc:9000
          insecure: true
          access_key_id: ${MINIO_USER}
          secret_access_key: ${MINIO_PASSWORD}

    blocks_storage:
      s3:
        bucket_name: mimir
      tsdb:
        dir: /data/tsdb
      bucket_store:
        sync_dir: /data/tsdb-sync

    compactor:
      data_dir: /data/compactor

    # Single ingester/store-gateway → replication factor must be 1 (default 3
    # never reaches quorum on one node and the ring stays unready).
    ingester:
      ring:
        replication_factor: 1
    store_gateway:
      sharding_ring:
        replication_factor: 1

    # Ruler/alertmanager are not used at this stage; keep them off object storage
    # (local disk) so we need only the one "mimir" bucket.
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler
    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/alertmanager

    limits:
      ingestion_rate: 100000
      ingestion_burst_size: 200000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
spec:
  replicas: 1
  # RWO PVC: a rolling update would deadlock (new pod can't mount while the old
  # one holds it), so replace the pod outright.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
    spec:
      initContainers:
        - name: create-bucket
          image: minio/mc
          command:
            - sh
            - -c
            - >
              mc alias set m http://minio.minio.svc:9000 "$MINIO_USER" "$MINIO_PASSWORD" &&
              mc mb --ignore-existing m/mimir
          env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef: { name: minio-creds, key: username }
            - name: MINIO_PASSWORD
              valueFrom:
                secretKeyRef: { name: minio-creds, key: password }
      containers:
        - name: mimir
          image: grafana/mimir:3.1.2
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -target=all
            - -config.expand-env=true
          env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef: { name: minio-creds, key: username }
            - name: MINIO_PASSWORD
              valueFrom:
                secretKeyRef: { name: minio-creds, key: password }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9095 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - { name: config, mountPath: /etc/mimir }
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: config
          configMap: { name: mimir-config }
        - name: data
          persistentVolumeClaim: { claimName: mimir-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: 9095, targetPort: grpc }
