# One-off Job: import the model we already have (baked into the training image at
# models/latest.joblib) into the MLflow registry as cashato-categorizer v1 and set
# it @champion. Idempotent (--if-absent): does nothing when a champion already
# exists, so re-syncs are safe; only a fresh MLflow DB re-imports it.
# The initContainer waits until the MLflow server actually answers.
apiVersion: batch/v1
kind: Job
metadata:
  name: register-champion
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: register-champion
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-mlflow
          image: cashato/train:dev
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import sys, time, urllib.request
              for _ in range(60):
                  try:
                      urllib.request.urlopen("http://mlflow.mlflow.svc:5000/health", timeout=5)
                      print("mlflow ready"); sys.exit(0)
                  except Exception as e:
                      print("waiting for mlflow:", e); time.sleep(5)
              sys.exit(1)
      containers:
        - name: register
          image: cashato/train:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "cashato.ml.register_model", "--if-absent"]
          env:
            - { name: MLFLOW_TRACKING_URI, value: http://mlflow.mlflow.svc:5000 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
