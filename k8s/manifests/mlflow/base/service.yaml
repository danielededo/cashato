# Tracking/registry endpoint: mlflow.mlflow.svc:5000. Used by ml/train.py
# (MLFLOW_TRACKING_URI) and by the C6c predictor to pull the registered model.
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - { name: http, port: 5000, targetPort: http }
