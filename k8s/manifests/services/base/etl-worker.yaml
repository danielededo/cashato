# etl-worker: consumes NATS jobs, fetches the object from MinIO, parses and loads
# into bronze/silver as etl_writer. No Service (it's a consumer, not an HTTP
# server); exposes Prometheus metrics on :9100. Stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-worker
  namespace: cashato
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: etl-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etl-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: etl-worker
          image: cashato/svc:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "services/etl-worker/worker.py"]
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: etl-writer-db, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: etl-writer-db, key: password }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@cashato-db-rw.cashato-data.svc:5432/cashato
            - { name: NATS_URL, value: nats://nats.nats.svc:4222 }
            - { name: MINIO_ENDPOINT, value: minio.minio.svc:9000 }
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: minio-creds, key: username }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: minio-creds, key: password }
            - { name: MINIO_BUCKET, value: cashato-uploads }
            - { name: MINIO_SECURE, value: "false" }
            # Distributed tracing: export OTLP spans to Alloy (unset = tracing off).
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://alloy.observability.svc:4317 }
          ports:
            - { name: metrics, containerPort: 9100 }
          livenessProbe:
            tcpSocket: { port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
