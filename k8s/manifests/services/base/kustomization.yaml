apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Each resource carries its own namespace (cashato); no namespace transformer
# (protects the strict-scoped SealedSecrets).
resources:
  - namespace.yaml
  - sealedsecret-etl-writer.yaml
  - sealedsecret-query-reader.yaml
  - sealedsecret-minio.yaml
  - ingest-api.yaml
  - etl-worker.yaml
  - categorizer.yaml
  - query-api.yaml
  - httproutes.yaml

# Runtime config (settings/categorie/mcc) as a ConfigMap — no longer baked into
# the image, so editing a rule/threshold no longer requires a rebuild. Stable name
# (no hash suffix) so the same object can be referenced across namespaces/apps;
# a config change is applied by Argo, then `kubectl rollout restart` to pick it up.
# NOTE: the source files live at the repo root (../../../../config), outside the
# kustomize root → Argo must run with `--load-restrictor LoadRestrictionsNone`.
configMapGenerator:
  - name: cashato-config
    files:
      - ../../../../config/settings.yaml
      - ../../../../config/categorie.yaml
      - ../../../../config/mcc.yaml
      - ../../../../config/banks.yaml
generatorOptions:
  disableNameSuffixHash: true

# One JSON patch applies the cross-cutting concerns to all four services
# (container 0): the config ConfigMap, a writable /tmp, and the hardened
# securityContext.
#
# NOTE these `op: add` values REPLACE the whole array — anything written into a
# Deployment's own `volumes`/`volumeMounts` is silently discarded here. Which is
# why /tmp belongs in this patch and not in the four files.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: config
            configMap:
              name: cashato-config
          # The only writable path the services need, and the reason a
          # read-only root filesystem is viable: uploads stream through a temp
          # file and stored statements are fetched to a temp copy before parsing.
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: config
            mountPath: /etc/cashato/config
            readOnly: true
          - name: tmp
            mountPath: /tmp
      # Same posture the frontend Deployment already runs with. It matters most
      # for the etl-worker, which parses UNTRUSTED uploaded PDFs through
      # pdfplumber/pdfminer — a historically CVE-bearing surface that has no
      # business running as root on a writable filesystem.
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CASHATO_CONFIG_DIR
          value: /etc/cashato/config
