# ingest-api: receives uploads, stores them in MinIO, enqueues NATS jobs. Connects
# to the DB as etl_writer (writes bronze.raw_files). Stateless (no volumes).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  namespace: cashato
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: ingest-api
          image: cashato/svc:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app/services/ingest-api
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: etl-writer-db, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: etl-writer-db, key: password }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@cashato-db-rw.cashato-data.svc:5432/cashato
            - { name: NATS_URL, value: nats://nats.nats.svc:4222 }
            - { name: MINIO_ENDPOINT, value: minio.minio.svc:9000 }
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: minio-creds, key: username }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: minio-creds, key: password }
            - { name: MINIO_BUCKET, value: cashato-uploads }
            - { name: MINIO_SECURE, value: "false" }
            # Distributed tracing: export OTLP spans to Alloy (unset = tracing off).
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://alloy.observability.svc:4317 }
          ports:
            - { name: http, containerPort: 8000 }
            - { name: metrics, containerPort: 9100 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-api
  namespace: cashato
spec:
  selector:
    app.kubernetes.io/name: ingest-api
  ports:
    - { name: http, port: 8000, targetPort: http }
