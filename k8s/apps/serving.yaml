# Child Application: model serving. The KServe InferenceService for the
# custom predictor. sync-wave 4 — after training (wave 3) has imported the
# @champion the predictor pulls at startup.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serving
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/cashato/cashato.git
    targetRevision: main
    path: k8s/manifests/serving/overlays/kind
  destination:
    server: https://kubernetes.default.svc
    namespace: cashato-ml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
