# Child Application: Tekton CI pipeline. sync-wave 7 — after the Tekton
# operator + components (tekton app, wave 6) exist, so the Pipeline/Task CRDs are
# present. Installs the cashato-ci namespace, ServiceAccount, the Gitea creds
# (SealedSecrets: git basic-auth + registry dockerconfig), the lint/test Task and
# the CI Pipeline. PipelineRuns are runtime objects, minted per push by the
# Tekton Triggers (EventListener + Gitea webhook).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-ci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/cashato/cashato.git
    targetRevision: main
    path: k8s/manifests/tekton-ci/overlays/kind
  destination:
    server: https://kubernetes.default.svc
    namespace: cashato-ci
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
